<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>República de la Esperanza — MSR</title>
  <style>
    :root {
      --rojo: #d32f2f;
      --azul: #1976d2;
      --verde: #2e7d32;
      --gris: #424242;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--gris);
      max-width: 850px;
      margin: 2rem auto;
      padding: 0 1.2rem;
      background-color: #fafafa;
    }
    h2 {
      color: var(--rojo);
      border-bottom: 2px solid var(--rojo);
      padding-bottom: 0.3rem;
      margin-top: 2rem;
    }
    h3 {
      color: var(--azul);
      margin-top: 1.5rem;
    }
    strong {
      color: var(--verde);
      font-weight: 600;
    }
    blockquote {
      font-style: italic;
      border-left: 4px solid var(--rojo);
      padding-left: 1.2rem;
      margin: 2rem 0;
      color: var(--gris);
    }
    .contacto {
      background: #fff;
      border: 1px solid #eee;
      padding: 1.2rem;
      border-radius: 4px;
      margin-top: 2rem;
    }
    .contacto h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>República de la Esperanza</h1>
  </header>

    “La esperanza no es un sentimiento, es una decisión política.”
  </blockquote>

  <footer class="contacto">
    <h3>✉️ Contacto</h3>
    <p>Santo Domingo, República Dominicana<br>
    <strong>✉️ contacto@republicaesperanza.org</strong></p>
  </footer>
</body>
</html>
